schema_version: 1

name: write-article
description: Write an original blog article based on a news title and reference link, using web research via Sonar Pro
created_at: "2026-04-09"
allow_manual: true
allow_cron: false
entrypoint: node index.js
working_dir: ./tasks/write-article

env_vars:
  common: []

inputs:
  - name: title
    type: string
    required: true
    help_tip: "Title of the news item to base the article on (e.g. 'Estados Unidos mantêm regras mais rígidas para imigração e vistos')"

  - name: link
    type: string
    required: true
    help_tip: "URL of the reference article. Used as the primary source — Sonar will also search for additional sources."

  - name: language
    type: string
    required: false
    default: "pt-BR"
    help_tip: "Language for the article output (e.g. pt-BR, en-US, es)"

  - name: blog_context
    type: string
    required: false
    default: "Blog voltado para brasileiros que querem tirar ou renovar o visto americano. O público quer informações práticas, atualizadas e confiáveis sobre o processo de visto."
    help_tip: "Description of your blog and audience. Used to tailor the article tone and focus."

