schema_version: 1

name: write-article
description: Write an original blog article based on a news title and reference link, using web research via Sonar Pro
created_at: "2026-04-09"
allow_manual: true
allow_cron: false
entrypoint: node index.js
working_dir: ./tasks/write-article

# ── Limits ────────────────────────────────────────────────────────────────────
timeout_seconds: 360            # must exceed the 240s Sonar web-research call

retry:
  max_retries: 2                # index not advanced on failure → retry same article
  delay_seconds: 15             # wait between retries
  backoff: exponential          # linear | exponential

env_vars:
  common: []

inputs:
  - name: rss_picker_file_pattern
    type: string
    required: true
    help_tip: "File pattern for RSS-picked articles (e.g. 'approved-visto-americano-[aaaa-mm-dd].json', where [aaaa-mm-dd] is auto-replaced with current date)"

  - name: current_approved_list_path
    type: string
    required: true
    help_tip: "Directory path where the approved articles list file is stored (e.g. '/path/to/approved-lists')"

  - name: language
    type: string
    required: false
    default: "pt-BR"
    help_tip: "Language for the article output (e.g. pt-BR, en-US, es)"

  - name: blog_context
    type: string
    required: false
    default: "Blog voltado para brasileiros que querem tirar ou renovar o visto americano. O público quer informações práticas, atualizadas e confiáveis sobre o processo de visto."
    help_tip: "Description of your blog and audience. Used to tailor the article tone and focus."

  - name: output_dir
    type: string
    required: true
    help_tip: "Diretório onde salvar os arquivos gerados (JSON e Markdown) - será criado se não existir"

