schema_version: 1

# ── Identity ──────────────────────────────────────────────────────────────────
name: feed-selector-visto-americano
description: "Evaluate news items from RSS feeds and select those relevant enough to become blog articles"

# ── AI provider ───────────────────────────────────────────────────────────────
# provider: openai      → uses OPENAI_API_KEY from ai-client/.env
# provider: perplexity  → uses PERPLEXITY_API_KEY from ai-client/.env
#                          (also has web search capability via sonar models)
provider: perplexity
model: sonar

# ── Prompt files ──────────────────────────────────────────────────────────────
# system.md  — defines the AI's role/persona (keep it short and focused)
# user.md    — the actual request; use {{variable}} for dynamic values
#
# Variables available in both files (no extra config needed):
#   {{<input_name>}}  — any input declared in task.config.yaml inputs[]
#   {{<input_name>}}  — any input declared in this template's inputs[] below
#
# Extra vars can be passed at call time from index.js:
#   await runPrompt({ date_today: new Date().toISOString() })
system_prompt_file: system.md
user_prompt_file: user.md

# ── Template-specific inputs (optional) ───────────────────────────────────────
# Inputs declared here are asked AFTER the task inputs, specific to this template.
# Task inputs (from task.config.yaml) are already available as {{variables}} —
# you do NOT need to redeclare them here.
#
# Only add inputs that are meaningful specifically to this template, not the task.
# Example: analysis depth, output style, etc.
inputs: []
  # - name: depth
  #   type: string           # string | number | boolean
  #   required: false
  #   default: detailed
  #   help_tip: "Output depth — brief or detailed"

# ── Options ───────────────────────────────────────────────────────────────────
options:
  temperature: 0.2         # 0.0 (deterministic) → 1.0 (creative)
  # max_tokens omitted → model uses its full default limit (~16k for gpt-4o-mini)
  # set explicitly when you need a hard cap, e.g. for short structured outputs:
  # max_tokens: 1000
  timeout_ms: 30000         # increase for long outputs (articles, reports)
  max_retries: 2

  # ── response_format ────────────────────────────────────────────────────────
  # Controls what the API receives for output formatting.
  # Omit this option entirely to get the default ('schema').
  #
  # ┌─────────────┬─────────────────────────────────────────────────────────────────────────┐
  # │ schema      │ (default) Sends json_schema → API guarantees structured JSON.           │
  # │             │ ✅ OpenAI (gpt-4o, gpt-4o-mini, etc.): always works, any length.       │
  # │             │ ✅ Perplexity sonar/sonar-pro: safe only for short fields               │
  # │             │    (< ~500 tokens each), e.g. classifications, summaries, ratings.      │
  # │             │ ⚠️  Perplexity + long fields: constrained decoding truncates or         │
  # │             │    empties content (markdownText, long descriptions, etc.).             │
  # ├─────────────┼─────────────────────────────────────────────────────────────────────────┤
  # │ json_object │ Sends { type: "json_object" } → valid JSON guaranteed, no schema.       │
  # │             │ ❌ Perplexity sonar/sonar-pro: NOT supported — returns HTTP 400.        │
  # │             │    Perplexity only accepts: text, json_schema, regex.                  │
  # │             │ ✅ OpenAI only (gpt-4o, gpt-4o-mini, etc.).                            │
  # ├─────────────┼─────────────────────────────────────────────────────────────────────────┤
  # │ none        │ No response_format sent → model generates completely freely.            │
  # │             │ ✅ Perplexity sonar/sonar-pro: safest for very long articles/reports.   │
  # │             │ ⚠️  Model may wrap output in ```json ... ``` — stripped automatically. │
  # │             │    Prompt MUST instruct the model to return JSON.                       │
  # │             │    Zod validates structure after parse.                                 │
  # └─────────────┴─────────────────────────────────────────────────────────────────────────┘
  #
  # Quick reference:
  #   provider: openai                             → omit (default 'schema' always works)
  #   provider: perplexity + short fields          → omit (default 'schema' is fine)
  #   provider: perplexity + medium/long fields    → response_format: none  (json_object NOT supported)
  #   provider: perplexity + very long (articles)  → response_format: none
  #
  response_format: none

# Output structure is defined in schema.js — no description needed here.
# schema.js is used by Zod as a validation safety net after parsing in all modes,
# and also sent to the API as json_schema when response_format is 'schema'.
