schema_version: 1

name: rss-picker
description: Triage raw RSS news items using AI to select only those worth turning into blog articles
created_at: "2026-04-08"
allow_manual: true
allow_cron: true
entrypoint: node index.js
working_dir: ./tasks/rss-picker

# ── Limits ────────────────────────────────────────────────────────────────────
timeout_seconds: 180            # AI triage call + I/O

retry:
  max_retries: 2                # number of retries on failure
  delay_seconds: 10             # wait between retries
  backoff: exponential          # linear | exponential

env_vars:
  common: []

inputs:
  - name: rss_fetcher_output_artifact_file_name_pattern
    type: string
    required: true
    help_tip: "Path pattern to today's rss-fetcher artifact. Use {group} and {date} as placeholders for the group name and today's date. e.g. artifacts/rss-fetcher/fetched-items-{group}-{date}.json"

  - name: blog_context
    type: string
    required: false
    default: "Blog voltado para brasileiros que querem tirar ou renovar o visto americano. O público quer informações práticas, atualizadas e confiáveis sobre o processo de visto."
    help_tip: "Description of your blog and audience. Used by the AI to judge relevance."

  - name: min_items
    type: number
    required: false
    default: 3
    help_tip: "Minimum number of NEW items (since last run) required to trigger AI triage. If below this, task exits silently."

  - name: min_score
    type: number
    required: false
    default: 7
    help_tip: "Minimum relevance score (0-10) for an item to be approved. 7 = strict, 5 = permissive."

  - name: action
    type: string
    required: false
    default: ""
    help_tip: "Ação a ser realizada: 'apr' para publicar ou 'del' para deletar."

  - name: item_index
    type: number
    required: false
    default: null
    help_tip: "Se definido, processa apenas o item de índice correspondente na lista de novos itens, pula a IA e grava direto o arquivo aprovado. 0 = primeiro da lista."
