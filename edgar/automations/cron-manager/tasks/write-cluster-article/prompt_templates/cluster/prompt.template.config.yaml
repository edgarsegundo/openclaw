schema_version: 1

# ── Identity ──────────────────────────────────────────────────────────────────
name: searchable-ai
description: Geração de artigo SEO com links internos, imagens e intervenções, seguindo cluster e estrutura avançada.

# ── AI provider ───────────────────────────────────────────────────────────────
# provider: openai      → uses OPENAI_API_KEY from ai-client/.env
# provider: perplexity  → uses PERPLEXITY_API_KEY from ai-client/.env
#                          (also has web search capability)
provider: perplexity
model: sonar-pro

# ── Prompt files ──────────────────────────────────────────────────────────────
# system.md  — defines the AI's role/persona (keep it short and focused)
# user.md    — the actual request; use {{variable}} for dynamic values
#
# Variables available in both files (no extra config needed):
#   {{<input_name>}}  — any input declared in task.config.yaml inputs[]
#   {{<input_name>}}  — any input declared in this template's inputs[] below
#
# Extra vars can be passed at call time from index.js:
#   await runPrompt({ date_today: new Date().toISOString() })
system_prompt_file: system.md
user_prompt_file: user.md

# ── Template-specific inputs (optional) ───────────────────────────────────────
# Inputs declared here are asked AFTER the task inputs, specific to this template.
# Task inputs (from task.config.yaml) are already available as {{variables}} —
# you do NOT need to redeclare them here.
#
# Only add inputs that are meaningful specifically to this template, not the task.
# Example: analysis depth, output style, etc.
inputs: []
  # - name: depth
  #   type: string           # string | number | boolean
  #   required: false
  #   default: detailed
  #   help_tip: "Output depth — brief or detailed"

# ── Options ───────────────────────────────────────────────────────────────────
options:
  temperature: 0.5          # 0.0 (deterministic) → 1.0 (creative)
  # max_tokens omitted → model uses its full default limit (~16k for gpt-4o-mini)
  # set explicitly when you need a hard cap, e.g. for short structured outputs:
  # max_tokens: 8000
  timeout_ms: 240000        # increase for long outputs (articles, reports)
  max_retries: 2
  # response_format: controls how the API receives the output schema.
  # ┌─────────────┬───────────────────────────────────────────────────────────────────────────┐
  # │ schema      │ Sends json_schema to the API → guaranteed structured JSON.                │
  # │             │ ✅ OpenAI: works for any output length.                                   │
  # │             │ ⚠️  Perplexity sonar/sonar-pro: causes constrained decoding that          │
  # │             │    truncates/empties long content fields (markdownText, etc.).             │
  # │             │    Safe only for short structured outputs (< ~500 tokens per field).      │
  # ├─────────────┼───────────────────────────────────────────────────────────────────────────┤
  # │ json_object │ Sends { type: "json_object" } → valid JSON guaranteed, no schema.         │
  # │             │ ❌ Perplexity sonar/sonar-pro: NOT supported — returns HTTP 400.          │
  # │             │    Perplexity only accepts: text, json_schema, regex.                    │
  # │             │ ✅ OpenAI only (gpt-4o, gpt-4o-mini, etc.).                              │
  # ├─────────────┼───────────────────────────────────────────────────────────────────────────┤
  # │ none        │ No response_format sent → model generates freely.                         │
  # │             │ ✅ Perplexity sonar/sonar-pro: safest for very long content (articles).   │
  # │             │ ⚠️  Model may wrap output in ```json ... ``` fences — stripped auto-      │
  # │             │    matically by the runner. Prompt must instruct model to return JSON.    │
  # │             │    Zod validates structure after parse.                                   │
  # └─────────────┴───────────────────────────────────────────────────────────────────────────┘
  # Using 'none' here: sonar-pro with schema enforcement empties markdownText (long article).
  # The system prompt already instructs the model to return JSON.
  response_format: none

# Output structure is defined in schema.js — no description needed here.
# The schema is sent to the API as json_schema (guaranteed structure)
# and also used by Zod as a final validation safety net.
